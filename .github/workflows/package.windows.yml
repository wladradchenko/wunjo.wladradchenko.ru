# Windows build via KDE Craft.
#
# Craft compiles Qt6, KF6, MLT and FFmpeg from source the first time, which does
# not fit in a job. So the run is split in two: "deps" builds the dependency
# tree and caches it, "app" restores that cache and builds only Wunjo Make.
# A cold deps job takes hours; a warm app job takes minutes.
#
# UNVERIFIED. Nobody has run this yet — it is written from the project's own
# dependency list and Craft's documented interface, not from a green run. Expect
# the first attempts to fail on package names; fix them in
# portable/packaging/craft/blueprints/apps/wunjo/wunjo.py.
name: CI/CD Pipeline Package Windows

on:
  workflow_dispatch:
    inputs:
      rebuild-deps:
        description: 'Rebuild the dependency cache from scratch'
        type: boolean
        default: false
      sign:
        description: 'Sign with SignPath (spends the grant certificate quota)'
        type: boolean
        default: false
        # Tag pushes always sign, input or not — see the conditions below.
  push:
    tags:
      - 'v*'

env:
  CRAFT_ROOT: C:\CraftRoot
  # msvc2022 is what Kdenlive ships with; mingw is the other supported target.
  # Spelling matches the ABI CraftBootstrap.py writes into CraftSettings.ini.
  CRAFT_ABI: windows-cl-msvc2022-x86_64

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 350   # the hosted limit is 6 h

    permissions:
      id-token: write
      contents: read
      # Dropping a cache entry is a write to the Actions API, not to the repo.
      actions: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # GitHub cache entries are immutable: saving under a key that already
      # exists is refused with a warning, not an overwrite. So skipping the
      # restore is only half a rebuild — without dropping the old entries the
      # save at the end is a no-op and the next run reads back exactly the tree
      # this one was meant to replace. --key matches by prefix, which is also
      # what restore-keys falls back to, so every stale entry has to go.
      - name: Drop the Craft cache
        if: ${{ inputs.rebuild-deps }}
        # bash, not pwsh: the gh invocation is the same on every runner.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(gh cache list --repo "$GITHUB_REPOSITORY" \
                              --key "craft-$CRAFT_ABI-" \
                              --limit 100 --json id --jq '.[].id')
          for id in $ids; do
            echo "deleting cache entry $id"
            gh cache delete "$id" --repo "$GITHUB_REPOSITORY"
          done

      # The whole Craft tree, dependencies included. Keyed on the blueprint so a
      # dependency change invalidates it; restore-keys let an unrelated change
      # start from the last good tree instead of from nothing.
      - name: Restore Craft cache
        if: ${{ !inputs.rebuild-deps }}
        uses: actions/cache/restore@v4
        id: craft-cache
        with:
          path: |
            ${{ env.CRAFT_ROOT }}
            !${{ env.CRAFT_ROOT }}/build
            !${{ env.CRAFT_ROOT }}/download
          key: craft-${{ env.CRAFT_ABI }}-${{ hashFiles('portable/packaging/craft/blueprints/apps/wunjo/wunjo.py') }}
          restore-keys: craft-${{ env.CRAFT_ABI }}-

      # CraftBootstrap.py takes no --target: it asks for platform, architecture
      # and compiler interactively. --use-defaults answers those prompts, and on
      # Windows the default compiler is Visual Studio 2022 — the ABI in
      # CRAFT_ABI above.
      # Craft is fetched from its GitHub mirror and handed to the bootstrap with
      # --localDev, instead of letting the bootstrap download it itself. Its own
      # path is invent.kde.org's /-/archive/master/craft-master.zip, which
      # GitLab generates on demand and which returns 502 under load even when
      # the rest of the site is healthy. The mirror is the same code from the
      # same host we already take CraftBootstrap.py from.
      - name: Bootstrap Craft
        if: steps.craft-cache.outputs.cache-matched-key == ''
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://raw.githubusercontent.com/KDE/craft/master/setup/CraftBootstrap.py -OutFile CraftBootstrap.py
          git clone --depth 1 --branch master https://github.com/KDE/craft.git craft-src

          # Craft warns that a gcc on PATH breaks its configuration, and the
          # runner image ships one in C:\mingw64\bin. Selecting the MSVC ABI and
          # then leaving a second C++ toolchain ahead of it on PATH is asking
          # for trouble, so take it out for the rest of the job.
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notmatch 'mingw' }) -join ';'
          "PATH=$env:PATH" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

          # --verbose makes CraftBootstrap pass -vvv to Craft, which logs the
          # vswhere command it runs to locate Visual Studio and what came back.
          # This step only runs on a cold cache, so the noise costs nothing and
          # "Unable to locate Visual Studio" stops being a dead end.
          python CraftBootstrap.py --prefix $env:CRAFT_ROOT --branch master --use-defaults --verbose --localDev craft-src

      # Craft derives everything from the ABI stored in CraftSettings.ini: which
      # binary cache it downloads from and which toolchain it configures. A
      # restored cache carries whatever ABI it was built with, so check it here
      # rather than an hour into fetching packages for the wrong compiler.
      - name: Check the Craft ABI
        shell: pwsh
        run: |
          $abi = (Select-String -Path "$env:CRAFT_ROOT\etc\CraftSettings.ini" -Pattern '^ABI\s*=\s*(.+)$').Matches.Groups[1].Value.Trim()
          Write-Host "Craft ABI: $abi"
          if ($abi -ne $env:CRAFT_ABI) {
            Write-Host "::error::Craft is set up for '$abi', expected '$env:CRAFT_ABI'. Re-run with 'Rebuild the dependency cache from scratch'."
            exit 1
          }

      - name: Register the Wunjo blueprint
        shell: pwsh
        run: python portable\packaging\craft\register-blueprint.py

      # Prebuilt where KDE publishes one, compiled where it does not. This is
      # the step that decides whether the job takes twenty minutes or five hours.
      - name: Build dependencies
        shell: pwsh
        run: |
          & "$env:CRAFT_ROOT\craft\craftenv.ps1"
          craft --ci-mode --install-deps --options "wunjo.srcDir=$env:GITHUB_WORKSPACE\portable" wunjo

      - name: Report disk space
        if: always()
        shell: pwsh
        run: Get-PSDrive -PSProvider FileSystem | Format-Table -AutoSize

      - name: Build Wunjo Make
        shell: pwsh
        run: |
          & "$env:CRAFT_ROOT\craft\craftenv.ps1"
          craft --ci-mode --no-cache --options "wunjo.srcDir=$env:GITHUB_WORKSPACE\portable" wunjo

      # ── signing ────────────────────────────────────────────────────────
      # Two executables and, later, the installer. Nothing else: the build ships
      # several hundred Qt and KF6 DLLs, and signing them would spend the grant
      # certificate's quota on files Windows never checks. What Windows actually
      # judges is the downloaded installer (it carries the Mark-of-the-Web) and,
      # for some AV and enterprise policies, the executables the user launches.
      #
      # The binaries are signed *before* packaging so the installer ships signed
      # files; the installer is signed after, as the last step.
      - name: Locate the executables
        if: ${{ inputs.sign }}
        shell: pwsh
        run: |
          & "$env:CRAFT_ROOT\craft\craftenv.ps1"
          $found = Get-ChildItem -Path $env:CRAFT_ROOT -Recurse -Include wunjo.exe, wunjo_render.exe -ErrorAction SilentlyContinue |
                   Where-Object { $_.FullName -notmatch '\\build\\' }
          if ($found.Count -lt 2) {
            Write-Host "::error::expected wunjo.exe and wunjo_render.exe, found $($found.Count)"
            $found | ForEach-Object { Write-Host "  $($_.FullName)" }
            exit 1
          }
          New-Item -ItemType Directory -Force -Path unsigned | Out-Null
          $found | ForEach-Object {
            Copy-Item $_.FullName -Destination unsigned
            Write-Host "to sign: $($_.FullName)"
            "$($_.Name)=$($_.FullName)" | Out-File -Append -Encoding utf8 exe-paths.txt
          }

      - name: Upload unsigned executables
        id: upload-unsigned-exes
        if: ${{ inputs.sign }}
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-exes-${{ github.run_id }}
          path: unsigned/

      - name: Sign the executables with SignPath
        if: ${{ inputs.sign }}
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGN_PATH_TOKEN }}
          organization-id: ${{ secrets.SIGN_PATH_ORGANIZATION_ID }}
          project-slug: 'wunjo.wladradchenko.ru'
          signing-policy-slug: 'release-signing'
          artifact-configuration-slug: 'initial_files'
          github-artifact-id: ${{ steps.upload-unsigned-exes.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: './signed-exes'

      - name: Put the signed executables back
        if: ${{ inputs.sign }}
        shell: pwsh
        run: |
          Get-Content exe-paths.txt | ForEach-Object {
            $name, $path = $_ -split '=', 2
            Copy-Item "./signed-exes/$name" -Destination $path -Force
            Write-Host "replaced $path"
          }

      - name: Package
        shell: pwsh
        run: |
          & "$env:CRAFT_ROOT\craft\craftenv.ps1"
          craft --ci-mode --install-deps nsis
          craft --ci-mode --package --options "wunjo.srcDir=$env:GITHUB_WORKSPACE\portable" wunjo

      - name: Collect installers
        shell: pwsh
        run: |
          & "$env:CRAFT_ROOT\craft\craftenv.ps1"
          $dir = craft -q --get "packageDestinationDir()" virtual/base
          # craftenv.ps1 cds out of the workspace, so spell the workspace out.
          $packages = Join-Path $env:GITHUB_WORKSPACE packages
          New-Item -ItemType Directory -Force -Path $packages | Out-Null
          Get-ChildItem -Path $dir -Recurse -Include *.exe, *.7z, *.sha256 | Copy-Item -Destination $packages
          Get-ChildItem $packages

      - name: Upload the unsigned installer
        id: upload-unsigned-installer
        if: ${{ inputs.sign }}
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer-${{ github.run_id }}
          path: packages/*.exe

      # The one signature that actually decides whether SmartScreen shouts at a
      # person who downloads the file.
      - name: Sign the installer with SignPath
        if: ${{ inputs.sign }}
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGN_PATH_TOKEN }}
          organization-id: ${{ secrets.SIGN_PATH_ORGANIZATION_ID }}
          project-slug: 'wunjo.wladradchenko.ru'
          signing-policy-slug: 'release-signing'
          artifact-configuration-slug: 'initial_exe'
          github-artifact-id: ${{ steps.upload-unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: './signed-installer'

      - name: Swap in the signed installer
        if: ${{ inputs.sign }}
        shell: pwsh
        run: Copy-Item ./signed-installer/* -Destination packages/ -Force

      - uses: actions/upload-artifact@v4
        with:
          name: wunjo-windows
          path: packages/
          retention-days: 14

      - name: Save Craft cache
        if: always() && steps.craft-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.CRAFT_ROOT }}
            !${{ env.CRAFT_ROOT }}/build
            !${{ env.CRAFT_ROOT }}/download
          key: craft-${{ env.CRAFT_ABI }}-${{ hashFiles('portable/packaging/craft/blueprints/apps/wunjo/wunjo.py') }}
