# Linux build via KDE Craft, packaged as an AppImage.
#
# Why not a .deb built against system libraries: the project needs Qt 6.10 and
# KDE Frameworks 6.21, and no Debian or Ubuntu release ships either. Any Linux
# package therefore has to carry the whole stack with it, and an AppImage is the
# format that does that with one file and no install step — which is what
# "download from the site and run it" needs.
#
# Runs inside AlmaLinux 9 rather than on the runner's own Ubuntu, for two
# reasons that turn out to be the same reason.
#
# KDE builds the Linux half of its Craft binary cache in
# storage.kde.org/vm-images/craft-appimage-alma9, whose recipe is public at
# sysadmin/ci-images/craft-appimage-alma9/Dockerfile: almalinux:9.8 plus a dnf
# list plus gcc-toolset-14. Those prebuilt packages are what makes this job take
# half an hour instead of a working day, and they only run on that base — on
# Ubuntu, Craft's own perl cannot even start, because Alma links it against
# libcrypt.so.2 and Debian and Ubuntu ship no such SONAME.
#
# And an AppImage runs on the glibc it was built against and anything newer, so
# the oldest practical base is what reaches the most machines. Alma 9 carries
# glibc 2.34 against Ubuntu 22.04's 2.35, so building here also reaches RHEL 9
# and its clones, which a build on any GitHub-hosted Ubuntu image would miss.
#
# UNVERIFIED. Written from the project's dependency list and Craft's documented
# interface, not from a green run. Expect the first attempts to fail on package
# names; fix them in portable/packaging/craft/blueprints/apps/wunjo/wunjo.py.
name: CI/CD Pipeline Package Linux

on:
  workflow_dispatch:
    inputs:
      rebuild-deps:
        description: 'Rebuild the dependency cache from scratch'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

env:
  CRAFT_ROOT: /opt/CraftRoot
  CRAFT_ABI: linux-gcc-x86_64
  # Part of the cache key, not of Craft's own naming: a tree built on one base
  # is useless on another, and the ABI alone does not say which base it was.
  CRAFT_BASE: alma9

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: almalinux:9.8
    timeout-minutes: 350

    permissions:
      contents: read
      # Dropping a cache entry is a write to the Actions API, not to the repo.
      actions: write

    steps:
      # First, before the checkout: the base image has no git, and without it
      # actions/checkout falls back to fetching a tarball over the API.
      # zstd is here for actions/cache rather than for the build — without it
      # the action falls back to gzip, which on a tree this size is slow
      # enough to notice on every run.
      #
      # The list is KDE's, from the Dockerfile named at the top of this file,
      # minus the parts that only serve their own GitLab runners (powershell,
      # gitlab-runner, the CI Python modules). Keeping the rest verbatim is
      # deliberate: it is the environment their binary cache was built in, and
      # guessing at a shorter list is how a package fails to configure three
      # hours from now.
      - name: Install build dependencies
        run: |
          dnf install -y 'dnf-command(config-manager)'
          # CodeReady Builder carries several of the xcb-util-*-devel packages.
          dnf config-manager --set-enabled crb
          dnf update -y
          dnf install -y \
            git-core cmake gcc-toolset-14 \
            python3.11 python3.11-devel python3.11-pip \
            sqlite zlib tar xz bzip2 gzip unzip which diffutils findutils file patch \
            zstd \
            fuse fuse-libs \
            at-spi2-atk-devel \
            mesa-vulkan-drivers vulkan-headers wayland-devel mesa-libGL-devel \
            mesa-libEGL-devel mesa-libgbm-devel \
            libX11-devel libX11-xcb libxcb-devel libxkbcommon-x11-devel \
            libxkbcommon-devel libXi-devel libXcomposite-devel libXcursor-devel \
            libXrandr-devel libXtst-devel libxkbfile-devel libdrm-devel \
            libXdamage-devel libxshmfence-devel \
            xcb-util-devel xcb-util-cursor xcb-util-cursor-devel \
            xcb-util-keysyms xcb-util-keysyms-devel \
            xcb-util-renderutil xcb-util-renderutil-devel \
            xcb-util-wm xcb-util-wm-devel \
            xcb-util-image xcb-util-image-devel \
            xorg-x11-util-macros xorg-x11-proto-devel \
            flex bison gperf libicu-devel ruby \
            alsa-lib-devel nspr-devel nss-devel \
            systemd-devel libmount-devel appstream-devel
          dnf clean all

      # gcc-toolset-14 is the compiler KDE built the cache with, and it lives
      # behind a shell script rather than on PATH. Sourcing it here and copying
      # the result into $GITHUB_ENV is what carries it into every later step;
      # sourcing it inside one step would reach only that step. PKG_CONFIG_PATH
      # is set for the same reason KDE sets it: the toolset shadows the system
      # pkg-config path, and xcb stops being found.
      - name: Enable gcc-toolset-14
        run: |
          source /opt/rh/gcc-toolset-14/enable
          {
            echo "PATH=$PATH"
            echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-}"
            echo "PKG_CONFIG_PATH=$(/usr/bin/pkg-config --variable pc_path pkg-config)"
          } >> "$GITHUB_ENV"
          gcc --version | head -1

      - uses: actions/checkout@v4

      # GitHub cache entries are immutable: saving under a key that already
      # exists is refused with a warning, not an overwrite. So skipping the
      # restore is only half a rebuild — without dropping the old entries the
      # save at the end is a no-op and the next run reads back exactly the tree
      # this one was meant to replace. The key filter is a prefix, which is also
      # what restore-keys falls back to, so every stale entry has to go.
      #
      # Done over the REST API rather than with `gh`, which the macOS and
      # Windows jobs use: the GitHub CLI is not in this image and is not worth a
      # third-party dnf repository for one call.
      - name: Drop the Craft cache
        if: ${{ inputs.rebuild-deps }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api="https://api.github.com/repos/$GITHUB_REPOSITORY/actions/caches"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")
          keys=$(curl -sS "${auth[@]}" "$api?key=craft-$CRAFT_BASE-$CRAFT_ABI-&per_page=100" |
                 python3.11 -c 'import json,sys; [print(c["key"]) for c in json.load(sys.stdin).get("actions_caches", [])]')
          for key in $keys; do
            echo "deleting cache entry $key"
            curl -sS -X DELETE "${auth[@]}" "$api?key=$key" >/dev/null
          done

      # The whole Craft tree, dependencies included. Keyed on the blueprint so a
      # dependency change invalidates it; restore-keys let an unrelated change
      # start from the last good tree instead of from nothing. build/ and
      # download/ are excluded: they hold source and object trees that are not
      # needed to reuse an installed prefix, and they are what would push the
      # entry past GitHub's 10 GB per-repository limit.
      - name: Restore Craft cache
        if: ${{ !inputs.rebuild-deps }}
        uses: actions/cache/restore@v4
        id: craft-cache
        with:
          path: |
            ${{ env.CRAFT_ROOT }}
            !${{ env.CRAFT_ROOT }}/build
            !${{ env.CRAFT_ROOT }}/download
          key: craft-${{ env.CRAFT_BASE }}-${{ env.CRAFT_ABI }}-${{ hashFiles('portable/packaging/craft/blueprints/apps/wunjo/wunjo.py') }}
          restore-keys: craft-${{ env.CRAFT_BASE }}-${{ env.CRAFT_ABI }}-

      # CraftBootstrap.py takes no --target: it asks for platform, architecture
      # and compiler interactively. --use-defaults answers those prompts, and on
      # 64-bit Linux the answers are linux / x86_64 / gcc — the ABI in CRAFT_ABI
      # above, which is the one KDE publishes a binary cache for. Bootstrapping
      # with python3.11 matches the version KDE uses and is what Craft records
      # in Paths/Python for every later run.
      - name: Bootstrap Craft
        if: steps.craft-cache.outputs.cache-matched-key == ''
        run: |
          curl -sSLo CraftBootstrap.py https://raw.githubusercontent.com/KDE/craft/master/setup/CraftBootstrap.py
          # CraftBootstrap decides the platform before anything else, and its
          # test for Android is literally `"ANDROID_SDK_ROOT" in os.environ`.
          # This image does not set it, but a base image that does would send
          # --use-defaults to android-clang-arm64 without a word.
          unset ANDROID_SDK_ROOT
          python3.11 CraftBootstrap.py --prefix "$CRAFT_ROOT" --branch master --use-defaults

      # Craft derives everything from the ABI stored in CraftSettings.ini: which
      # binary cache it downloads from and which toolchain it configures. A
      # restored cache carries whatever ABI it was built with, so check it here
      # rather than an hour into fetching packages for the wrong platform.
      - name: Check the Craft ABI
        run: |
          abi=$(sed -n 's/^ABI *= *//p' "$CRAFT_ROOT/etc/CraftSettings.ini")
          echo "Craft ABI: $abi"
          if [ "$abi" != "$CRAFT_ABI" ]; then
            echo "::error::Craft is set up for '$abi', expected '$CRAFT_ABI'. Re-run with 'Rebuild the dependency cache from scratch'."
            exit 1
          fi

      - name: Register the Wunjo blueprint
        run: python3.11 portable/packaging/craft/register-blueprint.py

      # --ci-mode on every Craft call: it sends Craft's own messages and the
      # merged stderr of every subprocess to stdout. Without it a compiler error
      # lands somewhere else entirely in the log, because GitHub interleaves the
      # two streams as it pleases.
      - name: Build dependencies
        run: |
          source "$CRAFT_ROOT/craft/craftenv.sh"
          craft --ci-mode --install-deps --options "wunjo.srcDir=$GITHUB_WORKSPACE/portable" wunjo

      # Craft's binary cache covers all but one package, so the tree is mostly
      # downloaded rather than compiled — but pulseaudio sets disableBinaryCache
      # in its recipe and always builds from source, and a runner that fills its
      # disk fails without saying so.
      - name: Report disk space
        if: always()
        run: df -h / "$CRAFT_ROOT" 2>/dev/null || df -h

      - name: Build Wunjo Make
        run: |
          source "$CRAFT_ROOT/craft/craftenv.sh"
          craft --ci-mode --no-cache --options "wunjo.srcDir=$GITHUB_WORKSPACE/portable" wunjo

      # linuxdeploy is itself an AppImage and there is no FUSE inside a
      # container. Craft handles that on its own: AppImagePackager checks for
      # /.dockerenv and sets APPIMAGE_EXTRACT_AND_RUN when it finds one.
      - name: Package as AppImage
        run: |
          source "$CRAFT_ROOT/craft/craftenv.sh"
          craft --ci-mode --package --options "[Packager]PackageType=AppImagePackager" \
                          --options "wunjo.srcDir=$GITHUB_WORKSPACE/portable" wunjo

      - name: Collect the AppImage
        run: |
          source "$CRAFT_ROOT/craft/craftenv.sh"
          dir=$(craft -q --get "packageDestinationDir()" virtual/base)
          # craftenv.sh cds into CraftRoot when sourced, so spell the workspace out.
          mkdir -p "$GITHUB_WORKSPACE/packages"
          find "$dir" \( -name '*.AppImage' -o -name '*.sha256' \) \
               -exec cp {} "$GITHUB_WORKSPACE/packages/" \;
          ls -la "$GITHUB_WORKSPACE/packages/"

      # A failed CMake configure prints "Configuring incomplete" at the end but
      # puts the reason wherever it happened, sometimes thousands of lines
      # earlier, and the detail behind a failed compiler or library check only
      # ever lands in CMakeFiles/*.log. Print both here so a red run explains
      # itself without a second one.
      - name: Show the failure logs
        if: failure()
        run: |
          build="$CRAFT_ROOT/build/apps/wunjo/work/build"
          for log in "$build/CMakeFiles/CMakeConfigureLog.yaml" \
                     "$build/CMakeFiles/CMakeError.log" \
                     "$build/CMakeFiles/CMakeOutput.log"; do
            [ -f "$log" ] || continue
            echo "::group::$log"
            tail -n 400 "$log"
            echo "::endgroup::"
          done
          # Craft keeps a per-package log of every command it ran.
          find "$CRAFT_ROOT/logs" -name '*.log' -newermt '-2 hours' 2>/dev/null |
            while read -r log; do
              echo "::group::$log"
              tail -n 200 "$log"
              echo "::endgroup::"
            done

      # No signing: Linux has no equivalent of SmartScreen or Gatekeeper, so a
      # checksum published next to the download is what people can actually
      # verify. Craft writes the .sha256 above.
      - uses: actions/upload-artifact@v4
        with:
          name: wunjo-linux-x86_64
          path: packages/
          retention-days: 14

      - name: Save Craft cache
        if: always() && steps.craft-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.CRAFT_ROOT }}
            !${{ env.CRAFT_ROOT }}/build
            !${{ env.CRAFT_ROOT }}/download
          key: craft-${{ env.CRAFT_BASE }}-${{ env.CRAFT_ABI }}-${{ hashFiles('portable/packaging/craft/blueprints/apps/wunjo/wunjo.py') }}
