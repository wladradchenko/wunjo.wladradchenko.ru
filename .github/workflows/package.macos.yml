# macOS build via KDE Craft.
#
# Homebrew has Qt but not the KDE Frameworks, so Craft is the only realistic
# route: it builds the whole stack and knows how to make a .dmg out of it.
#
# Only arm64 is built. The x86_64 runners (macos-13) are on their way out, and a
# universal binary means building everything twice and lipo-ing the result —
# worth doing only once there is demand from Intel Macs.
#
# UNVERIFIED. Written from the project's dependency list and Craft's documented
# interface, not from a green run. Expect the first attempts to fail on package
# names; fix them in portable/packaging/craft/blueprints/apps/wunjo/wunjo.py.
name: CI/CD Pipeline Package macOS

on:
  workflow_dispatch:
    inputs:
      rebuild-deps:
        description: 'Rebuild the dependency cache from scratch'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

env:
  CRAFT_ROOT: /Users/runner/CraftRoot
  APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
  CRAFT_ABI: macos-clang-arm64

jobs:
  build:
    runs-on: macos-14      # Apple Silicon
    timeout-minutes: 350

    permissions:
      contents: read
      # Dropping a cache entry is a write to the Actions API, not to the repo.
      actions: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # GitHub cache entries are immutable: saving under a key that already
      # exists is refused with a warning, not an overwrite. So skipping the
      # restore is only half a rebuild — without dropping the old entries the
      # save at the end is a no-op and the next run reads back exactly the tree
      # this one was meant to replace. --key matches by prefix, which is also
      # what restore-keys falls back to, so every stale entry has to go.
      - name: Drop the Craft cache
        if: ${{ inputs.rebuild-deps }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(gh cache list --repo "$GITHUB_REPOSITORY" \
                              --key "craft-$CRAFT_ABI-" \
                              --limit 100 --json id --jq '.[].id')
          for id in $ids; do
            echo "deleting cache entry $id"
            gh cache delete "$id" --repo "$GITHUB_REPOSITORY"
          done

      - name: Restore Craft cache
        if: ${{ !inputs.rebuild-deps }}
        uses: actions/cache/restore@v4
        id: craft-cache
        with:
          path: |
            ${{ env.CRAFT_ROOT }}
            !${{ env.CRAFT_ROOT }}/build
            !${{ env.CRAFT_ROOT }}/download
          key: craft-${{ env.CRAFT_ABI }}-${{ hashFiles('portable/packaging/craft/blueprints/apps/wunjo/wunjo.py') }}
          restore-keys: craft-${{ env.CRAFT_ABI }}-

      # CraftBootstrap.py takes no --target: it asks for platform, architecture
      # and compiler interactively. --use-defaults answers those prompts, and on
      # an Apple Silicon runner the answers are macos / arm64 / clang — the ABI
      # in CRAFT_ABI above.
      - name: Bootstrap Craft
        if: steps.craft-cache.outputs.cache-matched-key == ''
        run: |
          curl -sSLo CraftBootstrap.py https://raw.githubusercontent.com/KDE/craft/master/setup/CraftBootstrap.py
          # CraftBootstrap decides the platform before anything else, and its
          # test for Android is literally `"ANDROID_SDK_ROOT" in os.environ` —
          # which every hosted runner image sets, because it ships the Android
          # SDK. Left alone, --use-defaults picks android-clang-arm64 here.
          unset ANDROID_SDK_ROOT
          python3 CraftBootstrap.py --prefix "$CRAFT_ROOT" --branch master --use-defaults

      # Craft derives everything from the ABI stored in CraftSettings.ini: which
      # binary cache it downloads from and which toolchain it configures. A
      # restored cache carries whatever ABI it was built with, so check it here
      # rather than an hour into fetching packages for the wrong platform.
      - name: Check the Craft ABI
        run: |
          abi=$(sed -n 's/^ABI *= *//p' "$CRAFT_ROOT/etc/CraftSettings.ini")
          echo "Craft ABI: $abi"
          if [ "$abi" != "$CRAFT_ABI" ]; then
            echo "::error::Craft is set up for '$abi', expected '$CRAFT_ABI'. Re-run with 'Rebuild the dependency cache from scratch'."
            exit 1
          fi

      # KDE's macOS binary cache lags its blueprints — at the time of writing it
      # carries KF 6.28.0 while the recipes ask for 6.29.0 — so the frameworks
      # are compiled here rather than downloaded, and that is where this bites.
      #
      # Craft defaults MacDeploymentTarget to 13, but libc++ in the macOS 14 SDK
      # marks the floating-point std::to_chars as "introduced in macOS 13.3".
      # kcodecs 6.29 uses std::format on floats, so with a target below 13.3
      # every translation unit that reaches <format> fails to compile. Raising
      # it costs nothing against the cache: a deployment target is a minimum-OS
      # check, not an ABI, so a 13.3 build links against the prebuilt 13.0 Qt
      # exactly as before. It does mean the .dmg wants macOS 13.3 rather than
      # 13.0.
      - name: Raise the macOS deployment target
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          ini = Path(os.environ["CRAFT_ROOT"]) / "etc" / "CraftSettings.ini"
          lines = ini.read_text(encoding="utf-8").splitlines()
          section = None
          header = None
          for i, line in enumerate(lines):
              match = re.match(r"^\[(.+)\]\s*$", line)
              if match:
                  section = match.group(1)
                  if section == "General":
                      header = i
              elif section == "General" and re.match(r"^[#;]?\s*MacDeploymentTarget\s*=", line, re.I):
                  lines[i] = "MacDeploymentTarget = 13.3"
                  break
          else:
              if header is None:
                  raise SystemExit("no [General] section in CraftSettings.ini")
              lines.insert(header + 1, "MacDeploymentTarget = 13.3")

          ini.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          grep -n "MacDeploymentTarget" "$CRAFT_ROOT/etc/CraftSettings.ini"

      - name: Register the Wunjo blueprint
        run: python3 portable/packaging/craft/register-blueprint.py

      # ── kconfigwidgets without std::pmr ────────────────────────────────
      # KRecentFilesAction uses a std::pmr arena to de-duplicate the recent
      # files list. std::pmr lives in the libc++ dylib and Apple shipped it in
      # macOS 14, so the framework built here references a symbol that does not
      # exist on the 13.3 this build targets: the application then dies in dyld
      # before main() on any Mac older than 14, which is the whole thing a
      # deployment target is set to prevent. It shipped exactly that way once —
      # "Symbol not found: __ZNSt3__13pmr15memory_resourceD2Ev".
      #
      # The compiler did not object, so libc++'s availability annotations are
      # switched off somewhere in this toolchain and it will not object to the
      # next one either. That is what the bundle check after the build is for.
      #
      # Built before --install-deps, so everything that links against the
      # framework links against the patched one. --no-cache because the point is
      # to compile our source: a kconfigwidgets taken ready-made out of the
      # binary cache would bring the bug straight back.
      - name: Build kconfigwidgets from patched source
        run: |
          source "$CRAFT_ROOT/craft/craftenv.sh"
          craft --ci-mode --no-cache --fetch --unpack kconfigwidgets
          python3 "$GITHUB_WORKSPACE/portable/packaging/craft/apply-source-patch.py" \
                  src/krecentfilesaction.cpp \
                  "$GITHUB_WORKSPACE/portable/packaging/craft/patches/kconfigwidgets-no-pmr.patch" \
                  --gone pmr
          craft --ci-mode --no-cache --compile --install --qmerge kconfigwidgets

      # "/.buildTests=False" switches off -DBUILD_TESTING for every package, the
      # leading "/" being the root of the blueprint tree: Craft looks an option
      # up on a package and walks to its parent when unset (options.py:413), so
      # setting it there reaches all of them. It is what KDE's own CI config
      # does, and for the same two reasons.
      #
      # It is needed, not merely faster: KIO 6.29's autotests do not compile —
      # kfilewidgettest.cpp constructs LocationTestItem with two arguments and
      # the struct has no such constructor — and a framework's test suite
      # failing takes the whole dependency build with it. We do not run these
      # tests and have no reason to compile them.
      #
      # It also cannot cost a cache hit: buildTests is registered with
      # compatible=True, so the binary cache lookup skips it entirely.
      - name: Build dependencies
        run: |
          source "$CRAFT_ROOT/craft/craftenv.sh"
          craft --ci-mode --install-deps \
                --options "/.buildTests=False" \
                --options "wunjo.srcDir=$GITHUB_WORKSPACE/portable" wunjo

      # Craft's own binary cache covers all but one package, so the tree is
      # mostly downloaded rather than compiled — but pulseaudio does build from
      # source, and a runner that fills its disk fails without saying so.
      - name: Report disk space
        if: always()
        run: df -h / "$CRAFT_ROOT" 2>/dev/null || df -h

      - name: Build Wunjo Make
        run: |
          source "$CRAFT_ROOT/craft/craftenv.sh"
          craft --ci-mode --no-cache --options "wunjo.srcDir=$GITHUB_WORKSPACE/portable" wunjo

      # The check that was missing when a .dmg went out declaring macOS 13.3 and
      # referencing a macOS 14 symbol. It reads every Mach-O in the bundle and
      # fails the build when one asks for something newer than the minimum it
      # itself declares. Placed before signing on purpose: a bundle that cannot
      # start should not cost a notarisation round trip, and should never reach
      # the artifacts where somebody would install it.
      - name: Check the bundle against its deployment target
        run: |
          bundle=$(find "$CRAFT_ROOT" -maxdepth 4 -name 'wunjo.app' -type d | head -1)
          if [ -z "$bundle" ]; then echo "::error::wunjo.app not found under $CRAFT_ROOT"; exit 1; fi
          python3 "$GITHUB_WORKSPACE/portable/packaging/craft/check-bundle-abi.py" "$bundle"

      # ── signing ────────────────────────────────────────────────────────
      # Skipped entirely without an Apple Developer ID, and the build still
      # produces a .dmg — one that Gatekeeper refuses to open on any machine
      # that downloaded it. That artifact is for testing on a Mac where the
      # quarantine bit has been cleared, nothing else.
      #
      # macOS is not like Windows here: every Mach-O inside the bundle has to be
      # signed or notarisation rejects the whole thing, so there is no picking a
      # few files to save a signing quota. That is why --deep is used.
      #
      # Secrets required, all four or none:
      #   APPLE_CERT_P12          Developer ID Application certificate, base64
      #   APPLE_CERT_PASSWORD     its password
      #   APPLE_ID                the Apple ID that owns the developer account
      #   APPLE_TEAM_ID           the team identifier
      #   APPLE_APP_PASSWORD      an app-specific password for notarytool
      #
      # A SignPath-held key works here too: install their CryptoTokenKit
      # extension instead of importing the .p12, and leave the codesign call as
      # it is — it finds the identity in the keychain either way.
      - name: Import the signing certificate
        id: signing
        if: ${{ env.APPLE_CERT_P12 != '' }}
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$APPLE_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$APPLE_CERT_PASSWORD" \
                  -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" >/dev/null
          security list-keychain -d user -s "$keychain" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          identity=$(security find-identity -v -p codesigning "$keychain" | awk '/Developer ID Application/ {print $2; exit}')
          if [ -z "$identity" ]; then echo "::error::no Developer ID Application identity in the certificate"; exit 1; fi
          echo "identity=$identity" >> "$GITHUB_OUTPUT"

      - name: Sign the application bundle
        if: ${{ steps.signing.outputs.identity != '' }}
        run: |
          source "$CRAFT_ROOT/craft/craftenv.sh"
          bundle=$(find "$CRAFT_ROOT" -maxdepth 4 -name 'wunjo.app' -type d | head -1)
          if [ -z "$bundle" ]; then echo "::error::wunjo.app not found under $CRAFT_ROOT"; exit 1; fi
          echo "signing $bundle"
          # Hardened runtime is a notarisation requirement, not an option.
          codesign --deep --force --timestamp --options runtime \
                   --sign "${{ steps.signing.outputs.identity }}" "$bundle"
          codesign --verify --deep --strict --verbose=2 "$bundle"

      # --output-on-failure is what makes a failed package step say anything.
      # CraftCommands runs the package action under a buffered StageLogger and
      # only dumps that buffer when this is set, so without it the run ends at
      # "Checking for absolute library paths in package..." and the reason —
      # whether a bad dylib reference or the ad-hoc codesign that follows it —
      # never reaches the log. KDE's own CI sets the same thing.
      - name: Package
        run: |
          source "$CRAFT_ROOT/craft/craftenv.sh"
          craft --ci-mode --output-on-failure --package \
                --options "wunjo.srcDir=$GITHUB_WORKSPACE/portable" wunjo

      - name: Collect the disk image
        run: |
          source "$CRAFT_ROOT/craft/craftenv.sh"
          dir=$(craft -q --get "packageDestinationDir()" virtual/base)
          # craftenv.sh cds into CraftRoot when sourced, so spell the workspace out.
          mkdir -p "$GITHUB_WORKSPACE/packages"
          find "$dir" \( -name '*.dmg' -o -name '*.7z' -o -name '*.sha256' \) \
               -exec cp {} "$GITHUB_WORKSPACE/packages/" \;
          ls -la "$GITHUB_WORKSPACE/packages/"

      # Signing proves who built it; notarisation is Apple confirming they
      # scanned it. Gatekeeper wants both, and they are separate operations —
      # this one goes to Apple, not to the certificate holder.
      - name: Notarise and staple the disk image
        if: ${{ steps.signing.outputs.identity != '' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          for dmg in packages/*.dmg; do
            [ -e "$dmg" ] || continue
            echo "notarising $dmg"
            xcrun notarytool submit "$dmg" \
              --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD" --wait
            # Stapling puts the ticket inside the file, so it opens on a machine
            # that is offline when the user first runs it.
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: wunjo-macos-arm64
          path: packages/
          retention-days: 14

      - name: Save Craft cache
        if: always() && steps.craft-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.CRAFT_ROOT }}
            !${{ env.CRAFT_ROOT }}/build
            !${{ env.CRAFT_ROOT }}/download
          key: craft-${{ env.CRAFT_ABI }}-${{ hashFiles('portable/packaging/craft/blueprints/apps/wunjo/wunjo.py') }}
