# Every icon in this directory was drawn for Wunjo Make; they carry
# "Generator: Wunjo" or "Generator: Gravit". Two of them keep an upstream file
# name — application-x-kdenlivetitle and video-mlt-playlist — because those name
# MLT producers and mime types, not the artwork.
[[annotations]]
path = ["data/icons/**.png", "data/icons/**.svg", "data/icons/**.svgz", "data/icons/wunjo.ico"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Vladislav Radchenko <i@wladradchenko.ru>"
SPDX-License-Identifier = "LGPL-3.0-or-later"



